name: versions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: tag changed components
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: scripts/tag-component-versions.sh
