  <script>
    // Suppress harmless ResizeObserver loop warnings
    (function () {
      const Native = window.ResizeObserver;
      if (Native) {
        window.ResizeObserver = class extends Native {
          constructor(cb) { super((entries, obs) => requestAnimationFrame(() => { try { cb(entries, obs); } catch (e) {} })); }
        };
      }
      const re = /ResizeObserver loop/;
      const isRO = (x) => x && re.test(typeof x === 'string' ? x : x.message || '');
      window.addEventListener('error', (e) => { if (isRO(e.message)) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
      window.addEventListener('unhandledrejection', (e) => { if (isRO(e.reason)) { e.preventDefault(); } }, true);
      ['error','warn'].forEach((m) => {
        const orig = console[m];
        console[m] = function (...args) { if (args.some(isRO)) return; return orig.apply(this, args); };
      });
      window.onerror = (msg) => isRO(msg) ? true : undefined;
    })();
  </script>
