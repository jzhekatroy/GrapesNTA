<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grapes NTA · Анализ сетевого трафика</title>
  <script>
    // Suppress harmless ResizeObserver loop warnings
    (function () {
      const Native = window.ResizeObserver;
      if (Native) {
        window.ResizeObserver = class extends Native {
          constructor(cb) { super((entries, obs) => requestAnimationFrame(() => { try { cb(entries, obs); } catch (e) {} })); }
        };
      }
      const re = /ResizeObserver loop/;
      const isRO = (x) => x && re.test(typeof x === 'string' ? x : x.message || '');
      window.addEventListener('error', (e) => { if (isRO(e.message)) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
      window.addEventListener('unhandledrejection', (e) => { if (isRO(e.reason)) { e.preventDefault(); } }, true);
      ['error','warn'].forEach((m) => {
        const orig = console[m];
        console[m] = function (...args) { if (args.some(isRO)) return; return orig.apply(this, args); };
      });
      window.onerror = (msg) => isRO(msg) ? true : undefined;
    })();
  </script>
  <link rel="stylesheet" href="/styles/design-system.css">
  <link rel="stylesheet" href="/styles/app.css">
  <link rel="stylesheet" href="/styles/boot.css">
</head>
<body>
  <div id="root"></div>
  <div class="boot" id="boot">
    <div class="boot__panel">
      <div class="boot__head">
        <span class="boot__dot"></span>
        <span>Загрузка Grapes NTA…</span>
      </div>
      <div class="boot__meta">
        <div class="boot__status" id="boot-status">инициализация</div>
        <div class="boot__elapsed" id="boot-elapsed">0 ms</div>
      </div>
      <div class="boot__log" id="boot-log" aria-live="polite"></div>
    </div>
  </div>
  <script src="/runtime-config.js"></script>
  <script src="/data/boot-log.js"></script>

  <!-- React (core); Babel только в режиме frontendMode=babel -->
  <script src="/vendor/react.js" data-boot-label="react.js"></script>
  <script src="/vendor/react-dom.js" data-boot-label="react-dom.js"></script>
  <script>
    (function loadFrontendRuntime() {
      const mode = window.__GRAPES_RUNTIME__?.frontendMode
        || (window.__GRAPES_BUNDLE_MANIFEST__ ? 'bundled' : 'babel');
      if (mode === 'bundled') {
        // Prod после npm run build:frontend — без Babel, prebuilt bundles:
        // document.write('<script src="/dist/manifest.js"><\/script>');
        // document.write('<script src="' + __GRAPES_BUNDLE_MANIFEST__.core + '"><\/script>');
        console.warn('[Grapes] frontendMode=bundled, но /dist не собран — используйте npm run build:frontend');
      }
      if (mode !== 'bundled') {
        document.write('<script src="/vendor/babel.min.js" data-boot-label="babel.min.js"><\/script>');
        document.write('<script src="/data/boot-bridge.js"><\/script>');
      }
    })();
  </script>

  <!-- Core boot: данные, shell, lazy-loader, app (страницы — по demand через PageChunks) -->
  <script src="/data/protocol-colors.js" data-boot-label="protocol-colors.js"></script>
  <script src="/data/mock-fixtures.js" data-boot-label="mock-fixtures.js"></script>
  <script src="/data/logger.js" data-boot-label="logger.js"></script>
  <script src="/data/api.js" data-boot-label="api.js"></script>
  <script src="/data/auth-access.js" data-boot-label="auth-access.js"></script>
  <script src="/data/app-pages.js" data-boot-label="app-pages.js"></script>
  <script src="/data/page-chunks.manifest.js" data-boot-label="page-chunks.manifest.js"></script>
  <script src="/data/page-chunks.js" data-boot-label="page-chunks.js"></script>
  <script type="text/babel" src="/components/icons.jsx" data-boot-label="icons.jsx"></script>
  <script type="text/babel" src="/components/ui.jsx" data-boot-label="ui.jsx"></script>
  <script type="text/babel" src="/components/charts.jsx" data-boot-label="charts.jsx"></script>
  <script type="text/babel" src="/components/shell.jsx" data-boot-label="shell.jsx"></script>
  <script type="text/babel" src="/pages/access-denied.jsx" data-boot-label="access-denied.jsx"></script>
  <script type="text/babel" src="/pages/coming-soon.jsx" data-boot-label="coming-soon.jsx"></script>
  <script type="text/babel" src="/app.jsx" data-boot-label="app.jsx"></script>
</body>
</html>
