# grapes-nta UI (NTAdmin sources vendored in ./app).
#
#   cd /opt/GrapesNTA
#   ./deploy/deploy.sh ui
#
# Secrets: deploy/ui/.env (bootstrap from /opt/grapes/ui/.env on first deploy).
# Data:    UI_DATA_DIR (default /opt/grapes/ui/data for cutover continuity).

services:
  grapes-nta:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: grapes-nta:latest
    container_name: grapes-nta
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: true
    volumes:
      - ${UI_DATA_DIR:-/opt/grapes/ui/data}:/app/server/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
